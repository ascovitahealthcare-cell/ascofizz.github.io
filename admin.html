<style>
:root {
  /* ── Ascofizz brand palette — matches index.html (the storefront) ── */
  --bg: #FBF3E8;
  --bg2: #EDE3D2;
  --bg3: #F5EBDD;
  --surface: #FFFFFF;
  --surface2: #F7EFE3;
  --border: rgba(84,113,119,0.16);
  --border2: rgba(84,113,119,0.28);
  --green: #547177;
  --green-bright: #6C8B90;
  --green-glow: rgba(84,113,119,0.25);
  --green-text: #3F565B;
  --gold: #A97A1E;
  --gold-text: #8F6417;
  --red: #C2434F;
  --red-soft: rgba(194,67,79,0.14);
  --orange: #B65B1E;
  --blue: #3B7EA6;
  --text: #1D2320;
  --text2: #5B665C;
  --text3: #5C6A5D;
  --white: #FFFFFF;
  --mono: 'JetBrains Mono', monospace;
  --font: 'DM Sans', sans-serif;
  --display: 'Syne', sans-serif;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 4px 24px rgba(101,113,102,.14);
  --shadow-lg: 0 12px 48px rgba(101,113,102,.18);
  --glow: 0 0 24px rgba(84,113,119,0.2);
  /* RGB helper used by some rgba(var(--green-rgb), ...) rules */
  --green-rgb: 84,113,119;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:var(--bg2);}
::-webkit-scrollbar-thumb{background:var(--green);border-radius:4px;}

/* ═══ LOGIN ═══ */
#loginScreen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;}
.login-wrap{width:100%;max-width:400px;}
.login-logo{text-align:center;margin-bottom:32px;}
.logo-mark{width:64px;height:64px;background:var(--white);border:1px solid var(--border);border-radius:20px;display:inline-flex;align-items:center;justify-content:center;font-size:2rem;margin-bottom:1[...]}
.logo-mark img{width:100%;height:100%;object-fit:contain;padding:8px;}
.login-title{font-family:var(--display);font-size:1.6rem;font-weight:800;color:var(--text);display:block;}
.login-sub{color:var(--text3);font-size:0.8rem;margin-top:4px;display:block;}
.login-card{background:var(--surface);border:1px solid var(--border2);border-radius:20px;padding:32px;box-shadow:var(--shadow-lg);} 
.field-group{margin-bottom:18px;}
.field-label{display:block;font-size:0.75rem;font-weight:600;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:1px;}
.field-input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 14px;color:var(--text);font-family:var(--font);font-size:0.9rem;outline:none;tr[...]}
.field-input:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-glow);}
.btn-login{width:100%;background:linear-gradient(135deg,var(--green),var(--green-bright));color:white;border:none;border-radius:var(--radius-sm);padding:13px;font-family:var(--display);font-weight:700[...]
.btn-login:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(74,138,40,0.5);}
.login-error{background:var(--red-soft);border:1px solid rgba(229,53,53,0.3);color:#ff6b6b;border-radius:8px;padding:10px 14px;font-size:0.82rem;margin-top:12px;display:none;}
.login-hint{text-align:center;color:var(--text3);font-size:0.75rem;margin-top:20px;}

/* ═══ APP SHELL ═══ */
#app{display:none;height:100vh;overflow:hidden;}
.app-layout{display:grid;grid-template-columns:220px 1fr;grid-template-rows:56px calc(100vh - 56px);height:100vh;overflow:hidden;}

/* rest of file unchanged */
</style>

<style>
/* ── Design-system polish pass — consistent motion + depth across all
   three themes. Additive only, no selectors renamed. ── */

/* Cards: quiet hover-lift so the backoffice feels alive, not static */
.card{transition:box-shadow 0.25s cubic-bezier(.22,1,.36,1), transform 0.25s cubic-bezier(.22,1,.36,1);} 
.card:hover{box-shadow:0 10px 28px rgba(0,0,0,0.18);} 
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
</head>

  <div class="login-wrap">
    <div class="login-logo">

      <span class="login-sub">Admin Backoffice v8.0</span>
    </div>
    <div class="login-card">
      <div class="form-group" style="margin-bottom:16px">
        <label class="field-label" for="loginUser">Username</label>
        <input type="text" id="loginUser" class="field-input" placeholder="admin" value="admin" autocomplete="username">
      </div>
