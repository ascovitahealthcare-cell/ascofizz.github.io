<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Ozylix Admin — Neomorphism Login</title>
<style>
:root{--accent:#8a7350;--accent2:#b49a6c;--glow:rgba(138,115,80,.28);--card:rgba(250,246,238,.88);--text:#4a4136;--sub:#8a7f6e;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:linear-gradient(145deg,#EFE7D8 0%,#F7EFE3 50%,#E8DFCB 100%);color:var(--text);overflow:hidden;}
.scene{position:fixed;inset:0;overflow:hidden;pointer-events:none;perspective:900px;contain:strict;}.ring{position:absolute;border-radius:50%;border:2px solid rgba(138,115,80,.35);}.r1{width:300px;height:300px;top:12%;left:-60px;animation:spin 22s linear infinite;transform:rotateX(68deg);}.r2{width:420px;height:420px;bottom:-80px;right:-120px;animation:spin 31s linear infinite reverse;transform:rotateX(72deg);}.orbit{position:absolute;inset:0;border-radius:50%;border-top-color:#b49a6c;box-shadow:0 0 20px rgba(180,154,108,.25);}@keyframes spin{to{transform:rotateX(68deg) rotateZ(360deg)}}
.wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:2;}
.logo-row{display:flex;align-items:center;gap:14px;margin-bottom:30px;}
.logo-mark{width:64px;height:64px;border-radius:18px;background:var(--card);border:1px solid rgba(255,255,255,.16);
  display:flex;align-items:center;justify-content:center;font-size:1.7rem;backdrop-filter:blur(8px);
  box-shadow:0 10px 30px rgba(0,0,0,.3),0 0 34px var(--glow);animation:bob 7s ease-in-out infinite;}
.logo-mark img{width:82%;height:82%;object-fit:contain;}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.brand{font-size:1.9rem;font-weight:800;letter-spacing:.3px;}
.brand small{display:block;font-size:.72rem;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--sub);margin-top:4px;}
.chip{font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);border:1px solid rgba(255,255,255,.18);
  border-radius:999px;padding:4px 12px;margin-left:10px;background:rgba(0,0,0,.25);}
.card{width:min(420px,92vw);background:var(--card);border:1px solid rgba(255,255,255,.14);border-radius:24px;
  padding:34px 30px;box-shadow:0 24px 70px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06);backdrop-filter:blur(14px);}
.card h2{font-size:1.15rem;font-weight:700;margin-bottom:4px;}
.card p{color:var(--sub);font-size:.8rem;margin-bottom:22px;}
.lbl{display:block;font-size:.7rem;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:1px;margin-bottom:7px;}
.inp{width:100%;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.14);border-radius:11px;
  padding:12px 14px;color:var(--text);font-size:.92rem;outline:none;transition:border-color .2s,box-shadow .2s;font-family:inherit;}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow);}
.inp::placeholder{color:var(--sub);opacity:.7;}
.pw{position:relative;} .pw .inp{padding-right:44px;}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:9px;
  background:none;border:none;color:var(--sub);cursor:pointer;font-size:.95rem;}
.pw button:hover{color:var(--text);background:rgba(255,255,255,.06);}
.err{background:rgba(229,53,53,.12);border:1px solid rgba(229,53,53,.35);color:#ff9b9b;border-radius:10px;
  padding:9px 13px;font-size:.8rem;margin-top:14px;display:none;}
.btn{width:100%;margin-top:20px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;
  border-radius:12px;padding:13px;font-size:.96rem;font-weight:700;letter-spacing:.5px;cursor:pointer;transition:all .2s;
  box-shadow:0 10px 28px var(--glow);font-family:inherit;}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 34px var(--glow);}
.btn:disabled{opacity:.65;cursor:not-allowed;transform:none;}
.hint{color:var(--sub);font-size:.7rem;margin-top:18px;text-align:center;}
.hint a{color:var(--accent);text-decoration:none;}
.sw{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px;}
.sw a{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;color:var(--sub);
  border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:5px 11px;background:rgba(0,0,0,.22);transition:all .18s;}
.sw a:hover,.sw a.on{color:#fff;border-color:var(--accent);background:rgba(255,255,255,.07);}
@media (prefers-reduced-motion:reduce){.scene,.logo-mark{animation:none} .scene i{display:none}}
</style>
</head>
<body>
<div class="scene" aria-hidden="true"><div class="ring r1"><div class="orbit"></div></div><div class="ring r2"><div class="orbit"></div></div></div>
<div class="wrap">
  <div class="logo-row">
    <div class="logo-mark"><img src="assets/ozylix-logo.png" alt="Ozylix" onerror="this.style.display='none';this.parentNode.textContent='🌿'"></div>
    <div class="brand">Ozylix<small>Admin Backoffice</small></div>
    <span class="chip">☁️ Neomorphism theme</span>
  </div>
  <form class="card" onsubmit="event.preventDefault();doLogin();">
    <h2>Sign in</h2>
    <p>Restricted area — staff and owner accounts only.</p>
    <label class="lbl" for="u">Username</label>
    <input class="inp" type="text" id="u" placeholder="admin" value="admin" autocomplete="username" autocapitalize="none" style="margin-bottom:16px">
    <label class="lbl" for="p">Password</label>
    <div class="pw">
      <input class="inp" type="password" id="p" placeholder="Enter your password" autocomplete="current-password" autocapitalize="none">
      <button type="button" onclick="var i=document.getElementById('p');i.type=i.type==='password'?'text':'password';this.textContent=i.type==='password'?'👁':'🙈'">👁</button>
    </div>
    <div class="err" id="err">Invalid credentials. Please try again.</div>
    <button class="btn" type="submit" id="btn">Sign In →</button>
    <div class="sw" id="sw"></div>
  </form>
  <div class="hint">Secured backend · <a href="https://www.ozylix.com">www.ozylix.com</a></div>
</div>
<script>
var API='https://ascovitahealthcare-cell-github-io.onrender.com';
(function(){fetch(API+'/health',{signal:AbortSignal.timeout(90000)}).catch(function(){
  var e=document.getElementById('err');if(e){e.style.background='rgba(46,134,193,.15)';e.style.borderColor='rgba(46,134,193,.4)';
  e.style.color='#bfe3f7';e.textContent='⏳ Backend is starting up… ~30–60s. Please wait.';e.style.display='block';}
});})();
async function doLogin(){
  var user=document.getElementById('u').value.trim(),pass=document.getElementById('p').value.trim();
  var err=document.getElementById('err'),btn=document.getElementById('btn');
  if(!user||!pass){err.textContent='Enter username and password.';err.style.display='block';return;}
  err.style.display='none';btn.disabled=true;btn.textContent='Signing in…';
  for(var a=1;a<=3;a++){
    try{
      var r=await fetch(API+'/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({username:user,password:pass}),signal:AbortSignal.timeout(35000)});
      var d=await r.json();
      if(!r.ok||!d.token){err.style.background='';err.style.borderColor='';err.style.color='';
        err.textContent=d.error||'Invalid username or password.';err.style.display='block';btn.disabled=false;btn.textContent='Sign In →';return;}
      localStorage.setItem('ascovita_token',d.token);
      localStorage.setItem('ascovita_role',d.role||'admin');
      location.href='admin.html';
    }catch(e){if(a<3){err.style.background='rgba(46,134,193,.15)';err.style.borderColor='rgba(46,134,193,.4)';
      err.style.color='#bfe3f7';err.textContent='⏳ Server is waking up… attempt '+a+'/3 (takes ~60s on first load)';err.style.display='block';}
      else{err.style.background='';err.style.borderColor='';err.style.color='';err.textContent='Could not reach the backend. Please wait a minute and try again.';
      err.style.display='block';btn.disabled=false;btn.textContent='Sign In →';}}
  }
}
(function(){
  var themes={'deluxe': 'Deluxe', 'neo': 'Neomorphism', 'holo': 'Holograph 3D', 'frost': 'Aurora Frost', 'elysia': 'Elysia Cinematic', 'navy': 'Navy Glass'};
  var sw=document.getElementById('sw');
  Object.keys(themes).forEach(function(k){
    var a=document.createElement('a');
    a.href='login-'+k+'.html';a.textContent=themes[k];
    if(k==='neo')a.className='on';
    sw.appendChild(a);
  });
})();
</script>
</body>
</html>
