<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ascovita Healthcare</title>
  <script>
    // GitHub Pages SPA fix — redirects /shop, /about, /product/slug etc. back to index.html
    (function() {
      var path = window.location.pathname;

      // Prevent infinite loop
      if (window.location.search.indexOf('?p=') === 0) return;

      // Don't redirect root
      if (path === '/' || path === '/index.html') return;

      // Don't redirect real static files
      if (path.match(/\.(txt|xml|json|png|jpg|ico|svg|webp|js|css|html)$/i)) return;

      // Send path to index.html via ?p= so it can load the right section
      var newUrl = '/?p=' + encodeURIComponent(path);
      window.location.replace(newUrl);
    })();
  </script>
</head>
<body></body>
</html>
