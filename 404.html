<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Ascovita Healthcare</title>
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://www.ascovita.com/">
  <script>
    (function() {
      var path = window.location.pathname;

      // Prevent infinite loop
      if (window.location.search.indexOf('?p=') === 0) return;

      // Don't redirect root
      if (path === '/' || path === '/index.html') return;

      // Don't redirect real static files
      if (path.match(/\.(txt|xml|json|png|jpg|ico|svg|webp|js|css|html)$/i)) return;

      // SPA fix: send path to index.html via ?p= so it can load the right section
      var newUrl = '/?p=' + encodeURIComponent(path);
      window.location.replace(newUrl);
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f8faf5;
      color: #2d3a1e;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .container { max-width: 480px; }
    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      color: #4a7c2f;
      letter-spacing: -0.5px;
      margin-bottom: 32px;
    }
    .logo span { color: #2d5016; }
    h1 {
      font-size: 5rem;
      font-weight: 900;
      color: #4a7c2f;
      line-height: 1;
      margin-bottom: 8px;
    }
    h2 {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: #2d5016;
    }
    p {
      color: #5a6a45;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .btn {
      display: inline-block;
      background: #4a7c2f;
      color: #fff;
      text-decoration: none;
      padding: 14px 32px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 0.95rem;
      transition: background 0.2s;
    }
    .btn:hover { background: #2d5016; }
    .links {
      margin-top: 24px;
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .links a {
      color: #4a7c2f;
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      border-bottom: 1px solid #c5d9a8;
      padding-bottom: 2px;
    }
    .links a:hover { color: #2d5016; border-color: #4a7c2f; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">Asco<span>vita</span></div>
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The page you're looking for doesn't exist or has been moved.<br>
       You'll be redirected to the homepage shortly.</p>
    <a href="https://www.ascovita.com/" class="btn">Go to Homepage</a>
    <div class="links">
      <a href="https://www.ascovita.com/#shop">Shop</a>
      <a href="https://www.ascovita.com/#about">About</a>
      <a href="https://www.ascovita.com/#contact">Contact</a>
      <a href="https://www.ascovita.com/#b2b">B2B</a>
    </div>
  </div>
</body>
</html>
