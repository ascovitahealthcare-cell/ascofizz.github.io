      <stop offset=".6" stop-color="#C9D6D6"/><stop offset="1" stop-color="#33454A"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#pWater)"/>
  <g opacity=".9">
    <!-- filling line: a row of tubes on a conveyor -->
    <rect x="0" y="700" width="800" height="26" fill="#0B3238"/>
    <rect x="0" y="700" width="800" height="4" fill="#17E0C0" opacity=".35"/>
    <g>
      <rect x="70"  y="470" width="86" height="230" rx="24" fill="url(#pAl)"/>
      <rect x="196" y="440" width="86" height="260" rx="24" fill="url(#pAl)"/>
      <rect x="322" y="486" width="86" height="214" rx="24" fill="url(#pAl)"/>
      <rect x="448" y="440" width="86" height="260" rx="24" fill="url(#pAl)"/>
      <rect x="574" y="470" width="86" height="230" rx="24" fill="url(#pAl)"/>
      <rect x="700" y="500" width="86" height="200" rx="24" fill="url(#pAl)"/>
    </g>
    <!-- overhead lamps -->
    <g fill="#EAFFFA" opacity=".14">
