<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img"
     aria-label="Placeholder illustration of the Ascofizz manufacturing floor">
  <defs>
    <linearGradient id="pWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E5A5E"/><stop offset=".5" stop-color="#072E36"/><stop offset="1" stop-color="#02141A"/>
    </linearGradient>
    <linearGradient id="pAl" x1="0" y1="0" x2="1" y2="0">
