    <circle cx="560" cy="220" r="10" stroke-width="2.4"/>
    <circle cx="646" cy="176" r="7"  stroke-width="2"/>
    <circle cx="176" cy="260" r="12" stroke-width="2.6"/>
    <circle cx="132" cy="190" r="7"  stroke-width="2"/>
