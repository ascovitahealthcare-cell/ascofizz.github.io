<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420" role="img" aria-label="Ashwagandha effervescent tube dissolving in water">
  <defs>
    <linearGradient id="aTube" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B3050"/><stop offset=".18" stop-color="#8B7BB8"/>
      <stop offset=".46" stop-color="#D9CFF2"/><stop offset=".74" stop-color="#7E6DAC"/>
      <stop offset="1" stop-color="#332A46"/>
    </linearGradient>
    <linearGradient id="aCap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4A3E62"/><stop offset=".42" stop-color="#B9A9E0"/>
      <stop offset="1" stop-color="#3B3050"/>
    </linearGradient>
    <radialGradient id="aGlow" cx="50%" cy="42%" r="55%">
      <stop offset="0" stop-color="#B98CFF" stop-opacity=".55"/><stop offset="1" stop-color="#B98CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aTab" cx="36%" cy="28%" r="72%">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".5" stop-color="#E6DBFF"/><stop offset="1" stop-color="#A98FE0"/>
    </radialGradient>
  </defs>
  <rect width="420" height="420" fill="none"/>
  <ellipse cx="210" cy="212" rx="168" ry="168" fill="url(#aGlow)"/>

  <!-- the tube -->
  <g>
    <rect x="150" y="96" width="120" height="252" rx="26" fill="url(#aTube)"/>
    <rect x="150" y="96" width="120" height="30" rx="15" fill="url(#aCap)"/>
    <rect x="150.8" y="96.8" width="118.4" height="250.4" rx="25.5" fill="none" stroke="#EDE4FF" stroke-opacity=".34"/>
    <text x="210" y="196" text-anchor="middle" font-family="'Bricolage Grotesque','Arial Narrow',sans-serif"
          font-size="27" font-weight="800" letter-spacing="-1" fill="#2A2138">ASHWA</text>
    <text x="210" y="223" text-anchor="middle" font-family="'Bricolage Grotesque','Arial Narrow',sans-serif"
          font-size="27" font-weight="800" letter-spacing="-1" fill="#2A2138">GANDHA</text>
    <rect x="168" y="238" width="84" height="1.5" fill="#2A2138" fill-opacity=".35"/>
    <text x="210" y="258" text-anchor="middle" font-family="'Schibsted Grotesk',system-ui,sans-serif"
          font-size="10" font-weight="700" letter-spacing="2.4" fill="#2A2138" fill-opacity=".72">EFFERVESCENT</text>
    <text x="210" y="292" text-anchor="middle" font-family="'Schibsted Grotesk',system-ui,sans-serif"
          font-size="12.5" font-weight="700" letter-spacing=".4" fill="#2A2138" fill-opacity=".62">20 Tablets</text>
  </g>

  <!-- dissolving tablet + bubbles -->
  <circle cx="316" cy="286" r="34" fill="url(#aTab)"/>
  <path d="M298 286h36M316 268v36" stroke="#6B5A94" stroke-opacity=".38" stroke-width="3.4" stroke-linecap="round"/>
  <g fill="none" stroke="#EDE4FF" stroke-opacity=".8">
    <circle cx="330" cy="216" r="10" stroke-width="2.2"/>
    <circle cx="296" cy="176" r="6.5" stroke-width="1.8"/>
    <circle cx="344" cy="150" r="4.5" stroke-width="1.5"/>
    <circle cx="108" cy="204" r="8" stroke-width="2"/>
    <circle cx="88"  cy="150" r="5" stroke-width="1.6"/>
    <circle cx="126" cy="120" r="3.4" stroke-width="1.3"/>
  </g>
  <circle cx="312" cy="126" r="3" fill="#EDE4FF" fill-opacity=".6"/>
  <circle cx="104" cy="96"  r="2.4" fill="#EDE4FF" fill-opacity=".5"/>
</svg>
